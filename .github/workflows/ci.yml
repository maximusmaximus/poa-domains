# Node 22 runs core and escrow unit tests; Node 24 runs the full integration matrix.
name: native-and-reference-checks
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.15.0
          cache: npm
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm ci --ignore-scripts
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 WRANGLER_SEND_METRICS=false npm run ci:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiled
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/
            _site/
            cloudflare/generated/
  unit:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.15.0
          - "24"
        suite:
          - unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled
      - name: Run covered suite without rebuilding
        run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 node scripts/ci.mjs ${{ matrix.suite }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.node }}
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: .coverage/
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - "24"
        suite:
          - browser-smoke
          - browser-e2e
          - browser-escrow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm ci --ignore-scripts
      - name: Wait for this run's build artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |-
            for (let attempt = 0; attempt < 30; attempt++) {
              const args = {...context.repo, run_id: context.runId};
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts(args);
              if (artifacts.data.artifacts.some(a => a.name === 'compiled' && !a.expired)) return;
              const jobs = await github.rest.actions.listJobsForWorkflowRun(args);
              const build = jobs.data.jobs.find(j => j.name === 'build');
              if (build?.status === 'completed' && build.conclusion !== 'success') throw Error('Build failed; no test artifact');
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw Error('Timed out waiting for this run’s compiled artifact');
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled
      - name: Run covered suite without rebuilding
        run: env -i HOME=/root PATH="$PATH" LANG=C.UTF-8 PLAYWRIGHT_BROWSERS_PATH=/ms-playwright node scripts/ci.mjs ${{ matrix.suite }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.node }}
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: .coverage/
      - name: Retain emoji format failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-failure-${{ matrix.suite }}-${{ matrix.node }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            test-results/emoji-format-product-results.json
            test-results/emoji-format-product/*/error-context.md
            test-results/emoji-format-product/*/attachments/*.json
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    permissions:
      contents: read
      actions: read
  cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - "24"
        suite:
          - cloudflare-registry
          - cloudflare-recovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm ci --ignore-scripts
      - name: Wait for this run's build artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |-
            for (let attempt = 0; attempt < 30; attempt++) {
              const args = {...context.repo, run_id: context.runId};
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts(args);
              if (artifacts.data.artifacts.some(a => a.name === 'compiled' && !a.expired)) return;
              const jobs = await github.rest.actions.listJobsForWorkflowRun(args);
              const build = jobs.data.jobs.find(j => j.name === 'build');
              if (build?.status === 'completed' && build.conclusion !== 'success') throw Error('Build failed; no test artifact');
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw Error('Timed out waiting for this run’s compiled artifact');
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled
      - name: Run covered suite without rebuilding
        run: env -i HOME=/root PATH="$PATH" LANG=C.UTF-8 PLAYWRIGHT_BROWSERS_PATH=/ms-playwright node scripts/ci.mjs ${{ matrix.suite }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.node }}
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: .coverage/
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    permissions:
      contents: read
      actions: read
  escrow-local:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - "24"
        suite:
          - escrow-local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled
      - name: Run covered suite without rebuilding
        run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 node scripts/ci.mjs ${{ matrix.suite }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.node }}
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: .coverage/
  security:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - "24"
        suite:
          - security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled
      - name: Run covered suite without rebuilding
        run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 node scripts/ci.mjs ${{ matrix.suite }}
      - name: Redacted history and artifact scan
        run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 GITHUB_TOKEN="$GITHUB_TOKEN" bash scripts/gitleaks.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.node }}
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: .coverage/
  check:
    if: always()
    needs:
      - build
      - unit
      - browser
      - cloudflare
      - escrow-local
      - security
      - escrow-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All prerequisite jobs must succeed (no skipped or cancelled lanes)
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: node -e 'const r=JSON.parse(process.env.RESULTS); if(r.length!==7 || r.some(s=>s!=="success")) process.exit(1)'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: coverage-*
          path: .coverage
          merge-multiple: true
      - name: Enforce and summarize combined line and branch coverage
        run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" npm run ci:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage-report
          retention-days: 7
          if-no-files-found: warn
          path: coverage/
  escrow-unit:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.15.0
        suite:
          - escrow-unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled
      - name: Run covered suite without rebuilding
        run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 node scripts/ci.mjs ${{ matrix.suite }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.node }}
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: .coverage/
