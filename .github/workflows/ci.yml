name: native-and-reference-checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm ci --ignore-scripts
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npx playwright install --with-deps chromium
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm run check
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 GITHUB_TOKEN="$GITHUB_TOKEN" bash scripts/gitleaks.sh
      - name: Retain emoji format CI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emoji-format-ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            test-results/emoji-format-product-results.json
            test-results/emoji-format-product/*/error-context.md
            test-results/emoji-format-product/*/attachments/*.json

  escrow-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm ci --ignore-scripts
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm run cf:typecheck
      - run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm run escrow:test
