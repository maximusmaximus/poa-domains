name: publish-production-readonly
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Validate the publish build (no upload, no deploy) when this workflow changes.
  pull_request:
    paths: [".github/workflows/pages.yml"]
permissions: {}
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'maximusmaximus/poa-domains' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # Same pinned image as CI browser jobs: browsers and their OS libraries are preinstalled,
    # so publishing never depends on apt mirrors (azure.archive.ubuntu.com DNS failures).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install public dependencies without inherited credentials
        run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 npm ci --ignore-scripts
      - name: Trust the checked-out workspace for history scans inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify preinstalled Chromium (no apt; browser download only if missing, with retries)
        run: |
          for i in 1 2 3; do
            env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" npx playwright install chromium && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: Check production guards, reference test suite and public read-only bundle
        run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" npm run check
      - name: Redacted source, history and public artifact scan
        run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 GITHUB_TOKEN="$GITHUB_TOKEN" bash scripts/gitleaks.sh
      - name: Archive the exact tested public allowlist including discovery
        if: github.event_name != 'pull_request'
        run: node scripts/pages-archive.mjs _site "$RUNNER_TEMP/artifact.tar"
      - name: Upload only the validated public archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'maximusmaximus/poa-domains'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested production-only read-only page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
