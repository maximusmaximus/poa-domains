# PoA core compatibility watch (poa-compat-watch). See poa-compat.json.
name: poa-compat

on:
  schedule:
    # Off-peak 15-minute marks avoid GitHub Actions :00/:30 cron drops while keeping no-op runs ~5s.
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: Open a no-op evidence-timestamp pull request as the App, to verify merge starts CI and deploy
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: poa-compat
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Recommended: a GitHub App token, so the update pull request starts your normal CI
      # and its auto-merge triggers main CI + worker-gated-production deploy.
      - id: app
        if: ${{ vars.POA_COMPAT_APP_ID != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.POA_COMPAT_APP_ID }}
          private-key: ${{ secrets.POA_COMPAT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - id: preflight
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.selftest) }}
        env:
          GH_APP_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: node scripts/poa-compat-preflight.mjs

      - if: ${{ steps.preflight.outputs.should_run == 'true' }}
        uses: maximusmaximus/poa-compat-watch@ea911e959e1100a7e8990291ea32bdfb4d671666 # v1.1
        with:
          config: poa-compat.json
          node-version: '24'
          github-token: ${{ steps.app.outputs.token || github.token }}
          auto-merge-when: non-breaking-surface
          dispatch-workflow: ${{ steps.app.outputs.token == '' && 'ci.yml' || '' }}

      # Optional verification: opens a pin-free, UI-free PR as the App so its merge can start CI and deploy.
      - name: Open no-op self-test pull request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.selftest }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "App token was not minted; cannot run self-test."
            exit 1
          fi
          git config user.name "poa-compat-watcher[bot]"
          git config user.email "5868095+poa-compat-watcher[bot]@users.noreply.github.com"
          git checkout -B poa-compat/selftest
          mkdir -p .poa-compat
          node <<'NODE'
          const fs = require('fs');
          const path = '.poa-compat/evidence.json';
          let doc = { note: 'Generated by poa-compat. Evidence for each PoA core update applied to this project.', entries: [] };
          if (fs.existsSync(path)) {
            try { doc = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
          }
          if (!Array.isArray(doc.entries)) doc.entries = [];
          doc.selftestAt = new Date().toISOString();
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');
          NODE
          git add -- .poa-compat/evidence.json
          staged=$(git diff --cached --name-only)
          if [ "$staged" != ".poa-compat/evidence.json" ]; then
            echo "Refusing self-test: unexpected staged files"
            exit 1
          fi
          git commit -m "poa-compat self-test: record a no-op evidence timestamp"
          git push --force origin HEAD:refs/heads/poa-compat/selftest
          existing=$(gh pr list --head poa-compat/selftest --base main --state open --json number,url)
          url=$(printf '%s' "$existing" | jq -r '.[0].url // empty')
          if [ -n "$url" ]; then
            num=$(printf '%s' "$existing" | jq -r '.[0].number')
            gh pr edit "$num" --title "poa-compat self-test: no-op evidence timestamp" --body "No-op self-test opened by poa-compat-watcher. Touches only .poa-compat/evidence.json (a timestamp). Does not change pins, escrow, or UI. Auto-merge once required checks pass." --add-label poa-compat
          else
            url=$(gh pr create --base main --head poa-compat/selftest --title "poa-compat self-test: no-op evidence timestamp" --label poa-compat --body "No-op self-test opened by poa-compat-watcher. Touches only .poa-compat/evidence.json (a timestamp). Does not change pins, escrow, or UI. Auto-merge once required checks pass.")
            num=${url##*/}
          fi
          gh pr merge "$num" --auto --squash
          echo "Opened ${url}"
